name: 🚀 Deploy Laravel Filament via FTP (Rumahweb)

on:
  push:
    branches:
      - main  # sesuaikan kalau branch utama kamu bukan 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Ambil kode dari repo
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup caching agar build cepat
      - name: ⚡ Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: ⚡ Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 3️⃣ Setup PHP dan Node.js
      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, pdo, pdo_mysql

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4️⃣ Install dependencies
      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📦 Install NPM dependencies and build
        run: |
          npm ci
          npm run build

      # 5️⃣ Optimize Laravel
      - name: 🚀 Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # 6️⃣ Deploy ke Rumahweb via FTP (incremental)
      - name: 📤 Deploy to Rumahweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/eko-taqwa.bangkoding.my.id/   # ubah sesuai path project kamu
          exclude: |
            .git*
            .github*
            node_modules/
            tests/
            storage/logs/*
            storage/framework/cache/data/*
            storage/framework/sessions/*
            storage/framework/views/*
            bootstrap/cache/*.php
            vendor/bin/
            package*.json
            vite.config.js
            webpack.mix.js
            README.md
            .env.example
          state-name: .ftp-deploy-sync-state.json
          dry-run: false
          dangerous-clean-slate: false
